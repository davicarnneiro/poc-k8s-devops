apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poc-devops-api
  namespace: argocd
spec:
  project: default
  source:
    # Se o repositorio for PRIVADO, e preciso cadastra-lo no ArgoCD com um token de leitura
    # (Settings > Repositories, ou Secret com label argocd.argoproj.io/secret-type=repository).
    # Veja o README, Fase 3.5. Repositorio publico nao precisa de nada.
    repoURL: https://github.com/davicarnneiro/poc-k8s-devops.git
    targetRevision: main
    path: chart/poc-devops-api
  destination:
    server: https://kubernetes.default.svc
    namespace: poc-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true