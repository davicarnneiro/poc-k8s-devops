apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: poc-devops-api-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - poc-app
  selector:
    matchLabels:
      app: poc-devops-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
