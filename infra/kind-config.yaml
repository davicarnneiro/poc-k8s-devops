kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: poc-devops
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Portas publicadas SOMENTE em localhost: sem isso o kind escuta em 0.0.0.0 e os servicos
    # (Harbor, ArgoCD, Grafana...) ficariam acessiveis a qualquer maquina da rede local.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker