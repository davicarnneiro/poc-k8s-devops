apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-cosign-signature
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - poc-app
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "harbor.local:8080/poc-devops/*"
  attestors:
    - name: cosign
      cosign:
        key:
          data: |-
            -----BEGIN PUBLIC KEY-----
            <SUA CHAVE PUBLICA AQUI>
            -----END PUBLIC KEY-----
  validations:
    - expression: >
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign]) > 0).all(e, e)
      message: "A imagem deve estar assinada com a chave oficial do Cosign."
