name: CI/CD Pipeline - POC Kubernetes Local

on:
  workflow_dispatch:

  push:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: harbor.local:8080
  IMAGE_NAME: poc-devops/poc-devops-api

jobs:
  # 1. Testes Unitários e Análise Estática (SAST)
  test-and-sast:
    name: 1. Unit Tests & SonarQube SAST
    runs-on: self-hosted
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Validar Chart Helm (lint + render)
        run: |
          helm lint chart/poc-devops-api
          helm template poc chart/poc-devops-api --namespace poc-app > /dev/null

      - name: Setup Python e Testes Unitarios
        working-directory: app
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
          pytest -v   # gera coverage.xml (lido pelo SonarQube)

      - name: Analise SAST com SonarQube
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://sonar.local:8080
        with:
          projectBaseDir: app

  # 2. Build Multi-Stage e Scan de Segurança (Trivy)
  build-and-scan:
    name: 2. Build & Trivy Scan
    runs-on: self-hosted
    needs: test-and-sast
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir tag da imagem (SHA curto do commit, imutavel)
        id: meta
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag de deploy: ${TAG}"

      - name: Build da Imagem Docker Multi-Stage
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.tag }} \
            ./app

      - name: Scan de Vulnerabilidades com Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # 3. Publicação no Registry Local e Assinatura Criptográfica
  push-and-sign:
    name: 3. Push Harbor & Cosign Sign
    runs-on: self-hosted
    needs: build-and-scan
    steps:
      - name: Login e Push para o Harbor Local
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login $REGISTRY -u "${{ secrets.HARBOR_USER }}" --password-stdin
          docker push $REGISTRY/$IMAGE_NAME:${{ needs.build-and-scan.outputs.image_tag }}

      - name: Assinar Imagem com Cosign (Formato Classico .sig)
        env:
          COSIGN_PASSWORD: ""
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          TAG="${{ needs.build-and-scan.outputs.image_tag }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG"
          
          # Garante o digest exato da imagem recém-enviada
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF")
          if [ -z "$DIGEST" ]; then
            DIGEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(docker inspect --format='{{.Id}}' "$IMAGE_REF")"
          fi

          echo "Assinando o digest: $DIGEST"

          # Chave privada temporaria, sempre removida ao final (mesmo em erro)
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "${COSIGN_PRIVATE_KEY}" > "$KEY_FILE"

          cosign sign --key "$KEY_FILE" \
            --allow-http-registry \
            --allow-insecure-registry \
            --use-signing-config=false \
            --new-bundle-format=false \
            --yes \
            "$DIGEST"

  # 4. Entrega Contínua via GitOps (ArgoCD)
  gitops-deploy:
    name: 4. GitOps Update (ArgoCD)
    runs-on: self-hosted
    permissions:
      contents: write
    needs:
      - build-and-scan
      - push-and-sign
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Atualizar Tag no Chart Helm
        run: |
          IMAGE_TAG="${{ needs.build-and-scan.outputs.image_tag }}"
          sed -i "s/^  tag: .*/  tag: \"$IMAGE_TAG\"/" chart/poc-devops-api/values.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/poc-devops-api/values.yaml

          # Verifica se há modificações reais antes de tentar o commit
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada no values.yaml. Pulando commit."
          else
            git commit -m "chore(cd): update image tag to $IMAGE_TAG [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi