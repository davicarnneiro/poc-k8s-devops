name: CI/CD Pipeline - POC Kubernetes Local

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: harbor.local:8080
  IMAGE_NAME: poc-devops/poc-devops-api

jobs:
  # 1. Testes Unitários e Análise Estática (SAST)
  test-and-sast:
    name: 1. Unit Tests & SonarQube SAST
    runs-on: self-hosted
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Python e Testes Unitarios
        working-directory: app
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
          pytest -v

      - name: Analise SAST com SonarQube
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://sonar.local:8080
        with:
          projectBaseDir: app

  # 2. Build Multi-Stage e Scan de Segurança (Trivy)
  build-and-scan:
    name: 2. Build & Trivy Scan
    runs-on: self-hosted
    needs: test-and-sast
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.semver }}
      sha_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout do codigo (historico completo para SemVer)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir Tag Semantica (SemVer) e Commit SHA
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF#refs/tags/}"
          else
            LAST_TAG=$(git tag --list "v*.*.*" --sort=-v:refname | head -n 1)
            if [[ -z "$LAST_TAG" ]]; then
              SEMVER="v1.0.0"
            else
              VERSION="${LAST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              NEXT_PATCH=$((PATCH + 1))
              SEMVER="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
          fi

          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Versao SemVer definida: ${SEMVER} | Commit SHA: ${SHORT_SHA}"

      - name: Build da Imagem Docker Multi-Stage
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.semver }} \
            -t $REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.sha }} \
            ./app

      - name: Scan de Vulnerabilidades com Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.semver }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # 3. Publicação no Registry Local e Assinatura Criptográfica
  push-and-sign:
    name: 3. Push Harbor & Cosign Sign
    runs-on: self-hosted
    needs: build-and-scan
    steps:
      - name: Login e Push para o Harbor Local
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login $REGISTRY -u "${{ secrets.HARBOR_USER }}" --password-stdin
          docker push $REGISTRY/$IMAGE_NAME:${{ needs.build-and-scan.outputs.image_tag }}
          docker push $REGISTRY/$IMAGE_NAME:${{ needs.build-and-scan.outputs.sha_tag }}

      - name: Assinar Imagem com Cosign
        env:
          COSIGN_PASSWORD: ""
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          IMAGE_TAG="${{ needs.build-and-scan.outputs.image_tag }}"
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $REGISTRY/$IMAGE_NAME:$IMAGE_TAG)
          cosign signing-config create --with-default-services=false > /tmp/signing-config.json
          cosign sign --yes --signing-config=/tmp/signing-config.json --allow-http-registry --allow-insecure-registry --key env://COSIGN_PRIVATE_KEY "$IMAGE_DIGEST"

  # 4. Entrega Contínua via GitOps (ArgoCD)
  gitops-deploy:
    name: 4. GitOps Update (ArgoCD)
    runs-on: self-hosted
    needs:
      - build-and-scan
      - push-and-sign
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Atualizar Tag SemVer no Chart Helm
        run: |
          IMAGE_TAG="${{ needs.build-and-scan.outputs.image_tag }}"
          sed -i "s/tag: .*/tag: \"$IMAGE_TAG\"/" chart/poc-devops-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/poc-devops-api/values.yaml
          git commit -m "chore(cd): update image tag to $IMAGE_TAG [skip ci]"
          git push origin main