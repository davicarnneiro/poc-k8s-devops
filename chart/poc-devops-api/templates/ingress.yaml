{{- if .Values.ingress.enabled }}
{{- $fullname := include "poc-devops-api.fullname" . -}}
{{- $serviceName := $fullname -}}
{{- if and
      (eq .Values.workload.type "rollout")
      (eq .Values.deploymentStrategy.type "canary")
}}
  {{- $serviceName = default
        (printf "%s-active" $fullname)
        .Values.deploymentStrategy.canary.activeService
  -}}
{{- end }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "poc-devops-api.fullname" . }}
  labels:
    {{- include "poc-devops-api.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "poc-devops-api.fullname" . }}
                port:
                  number: {{ (index .Values.service.ports 0).port | default 80 }}
{{- end }}
