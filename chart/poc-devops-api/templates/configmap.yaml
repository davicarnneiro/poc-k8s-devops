apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "poc-devops-api.fullname" . }}-config
  labels:
    {{- include "poc-devops-api.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  APP_MESSAGE: {{ .Values.config.appMessage | quote }}
  APP_ERROR_RATE: {{ .Values.config.errorRate | default "0" | quote }}
