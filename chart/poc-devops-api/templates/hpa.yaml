{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "application.fullname" . }}
spec:
  scaleTargetRef:
    apiVersion: {{ ternary "argoproj.io/v1alpha1" "apps/v1" (eq .Values.workload.type "rollout") }}
    kind: {{ ternary "Rollout" (title .Values.workload.type) (eq .Values.workload.type "rollout") }}
    name: {{ include "application.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics: {{- toYaml .Values.hpa.metrics | nindent 4 }}
{{- end }}

