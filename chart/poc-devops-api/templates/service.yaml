{{- if .Values.service.enabled }}
{{- $fullname := include "poc-devops-api.fullname" . -}}
{{- if eq .Values.deploymentStrategy.type "canary" }}
# ---------------------------------------------------------
# CANARY - STABLE SERVICE
# ---------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ default $fullname .Values.deploymentStrategy.canary.stableService | quote }}
  labels:
    {{- include "poc-devops-api.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "poc-devops-api.selectorLabels" . | nindent 4 }}
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}

---
# ---------------------------------------------------------
# CANARY - CANARY SERVICE
# ---------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ default (printf "%s-canary" $fullname) .Values.deploymentStrategy.canary.canaryService | quote }}
  labels:
    {{- include "poc-devops-api.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "poc-devops-api.selectorLabels" . | nindent 4 }}
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}

{{- else }}
---
# ---------------------------------------------------------
# STANDARD SERVICE
# ---------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "poc-devops-api.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}
  selector:
    {{- include "poc-devops-api.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
