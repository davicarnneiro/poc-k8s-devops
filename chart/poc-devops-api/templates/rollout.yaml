{{- if eq .Values.workload.type "rollout" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "application.fullname.fullname" . }}
  labels:
    {{- include "application.fullname.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.workload.replicas | default .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.workload.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "application.fullname.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "application.fullname.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            {{- toYaml .Values.container.ports | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.container.resources | nindent 12 }}
  strategy:
    canary:
      stableService: {{ default (include "application.fullname" .) .Values.deploymentStrategy.canary.stableService }}
      canaryService: {{ default (printf "%s-canary" (include "application.fullname" .)) .Values.deploymentStrategy.canary.canaryService }}
      maxSurge: {{ .Values.deploymentStrategy.canary.maxSurge }}
      maxUnavailable: {{ .Values.deploymentStrategy.canary.maxUnavailable }}
      steps:
        {{- toYaml .Values.deploymentStrategy.canary.steps | nindent 8 }}
      {{- if .Values.deploymentStrategy.canary.analysis.enabled }}
      analysis:
        templates: {{ toYaml .Values.deploymentStrategy.canary.analysis.templates | nindent 10 }}
        args: {{ toYaml .Values.deploymentStrategy.canary.analysis.args | nindent 10 }}
      {{- end }}
{{- end }}