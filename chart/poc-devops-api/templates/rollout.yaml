apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "poc-devops-api.fullname" . }}
  labels:
    {{- include "poc-devops-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "poc-devops-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poc-devops-api.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  strategy:
    canary:
      stableService: {{ .Values.deploymentStrategy.canary.stableService }}
      canaryService: {{ .Values.deploymentStrategy.canary.canaryService }}
      maxSurge: {{ .Values.deploymentStrategy.canary.maxSurge }}
      maxUnavailable: {{ .Values.deploymentStrategy.canary.maxUnavailable }}
      trafficRouting:
        nginx:
          stableIngress: {{ include "poc-devops-api.fullname" . }}
      steps:
        {{- toYaml .Values.deploymentStrategy.canary.steps | nindent 8 }}
