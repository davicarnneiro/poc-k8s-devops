{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "poc-devops-api.fullname" . }}
  {{- with .Values.serviceMonitor.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels: {{- toYaml .Values.serviceMonitor.labels | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "poc-devops-api.selectorLabels" . | nindent 6 }}
  endpoints: {{- toYaml .Values.serviceMonitor.endpoints | nindent 4 }}
{{- end }}
