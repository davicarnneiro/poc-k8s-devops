apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "poc-devops-api.fullname" . }}
  labels:
    {{- include "poc-devops-api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "poc-devops-api.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s