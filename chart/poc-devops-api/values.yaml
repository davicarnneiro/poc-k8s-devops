fullnameOverride: poc-devops-api
image:
  repository: harbor.local:8080/poc-devops/poc-devops-api
  tag: "7fda083"
  pullPolicy: IfNotPresent

container:
  ports:
    - name: http
      containerPort: 8000
      protocol: TCP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "250m"
      memory: 512Mi
config:
  appEnv: "devops-local"
  appMessage: "Aplicacao implantada via Helm + ArgoCD!"
  # Demo de rollback automatico: fracao (0 a 1) das requisicoes a "/" que retornam 500. Mantenha "0".
  errorRate: "0"

deploymentStrategy:
  type: canary
  canary:
    stableService: "poc-devops-api"
    canaryService: "poc-devops-api-canary"
    maxSurge: 1
    maxUnavailable: 0
    # Rollback automatico: aborta o canary se erro 5xx > 5% ou latencia P95 > 0.5s
    analysis:
      enabled: true
      startingStep: 1
      interval: 30s
      failureLimit: 1
      minSuccessRate: 0.95
      maxP95Seconds: 0.5
      prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
    steps:
      - setWeight: 10
      - pause:
          duration: 2m
      - setWeight: 25
      - pause:
          duration: 5m
      - setWeight: 50
      - pause:
          duration: 10m
      - setWeight: 100

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

ingress:
  enabled: true
  className: nginx
  host: app.local
  path: /
  pathType: Prefix

secret:
  apiToken: "token-secreto-poc-2026"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: true
  portName: http
  path: /metrics
  interval: 15s
