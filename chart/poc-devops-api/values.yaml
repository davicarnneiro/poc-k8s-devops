replicaCount: 2

image:
  repository: harbor.local/poc/poc-devops-api
  pullPolicy: IfNotPresent
  tag: "9fd509b"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: app.local
  path: /
  pathType: Prefix

config:
  appEnv: "production-local"
  appMessage: "Aplicacao implantada via Helm + ArgoCD!"

secret:
  apiToken: "token-secreto-poc-2026"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70