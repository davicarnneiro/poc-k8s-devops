fullnameOverride: poc-devops-api
replicaCount: 1

image:
  repository: harbor.local:8080/poc-devops/poc-devops-api
  tag: "9fd509b"
  pullPolicy: IfNotPresent

workload:
  type: rollout
  replicas: 1

deploymentStrategy:
  type: canary
  canary:
    stableService: "poc-devops-api"
    canaryService: "poc-devops-api-canary"
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 10
      - pause:
          duration: 2m
      - setWeight: 25
      - pause:
          duration: 5m
      - setWeight: 50
      - pause:
          duration: 10m
      - setWeight: 100

container:
  ports:
    - name: http
      containerPort: 8000
      protocol: TCP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "250m"
      memory: 512Mi

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scheme: http

ingress:
  enabled: true
  className: nginx
  host: app.local
  path: /
  pathType: Prefix

config:
  appEnv: "devops-local"
  appMessage: "Aplicacao implantada via Helm + ArgoCD!"

secret:
  apiToken: "token-secreto-poc-2026"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
